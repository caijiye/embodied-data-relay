name: Bug report
description: Report a reproducible problem with the pipeline, dashboard, or hardware reference design.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include customer data, credentials, or personal information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command, config excerpt, and error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Minimal dataset or synthetic command that reproduces the issue.
      placeholder: |
        1. python scripts/synth_recorder.py ...
        2. python -m edr.cli pipeline ...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, FFmpeg, disk layout, commit
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed credentials and customer data from logs and attachments.
          required: true
