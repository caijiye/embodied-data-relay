name: Feature request
description: Propose a capability or hardware improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real data-collection or delivery problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should be built? Include data format, hardware, or API details if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ingest / storage
        - quality gate
        - transcode / data format
        - tiering
        - delivery
        - dashboard
        - hardware / enclosure
        - firmware
        - docs / governance
