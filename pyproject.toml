[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embodied-data-relay"
version = "0.1.0"
description = "Edge data station for embodied AI: session-aware ingest, quality gating, compaction, tiering and delivery."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Embodied Data Relay contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "watchdog>=4.0",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "pillow>=10.4",
  "boto3>=1.34",
  "pyyaml>=6.0",
  "psutil>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
pilot = ["pyarrow>=16"]

[project.scripts]
edr = "edr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["edr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
